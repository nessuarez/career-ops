# Copy to config/voice.yml (user layer). No secrets here: the Azure key and
# region live in .env as AZURE_SPEECH_KEY and AZURE_SPEECH_REGION.
voice:
  enabled: true
  locale: en-US                  # accent of the questions (en-US, en-GB, en-IN, ...)
  voice: en-US-JennyNeural       # any voice from `node voice/voice.mjs voices --locale en-US`
  style: friendly                # tone (mstts:express-as); used only if the voice supports it
  style_degree: 1.0              # style intensity, 0.01-2
  rate: "-5%"                    # speed; negative = slower
  pitch: default                 # "+5%", "-2st", default, ...
  show_text: true                # false = listening mode: the question is not shown as text
  player: auto                   # auto | afplay | aplay | paplay | ffplay | powershell
  cache: true                    # do not pay twice for the same text
  monthly_char_budget: 450000    # warn before the 500,000 free characters of the F0 tier

  # Recording (SoX): starts when you speak, stops after trailing silence.
  record_device: default         # waveaudio device name; "default" = Windows default microphone
  record_silence_threshold: 0.15%  # MINIMUM level counted as speech; the real threshold is calibrated on the room noise (up to 1%)
  record_stop_silence_s: 3.0     # seconds of silence that end the recording
  record_max_s: 150              # hard cut, only a safety net; --max overrides it

  # Pronunciation assessment (assess): thresholds for what gets reported.
  assess_accuracy_min: 60        # a word below this accuracy (0-100) is a candidate to fix
  assess_prosody_min: 70         # prosody score below this is flagged
  assess_wpm_min: 120            # pace outside min-max words per minute is flagged
  assess_wpm_max: 160
  assess_long_pause_s: 1.0       # a gap between two words at least this long is reported
  assess_max_words: 3            # words to fix per answer

  # Interviewer persona overlays; any base setting above can be overridden.
  personas:
    recruiter:      { voice: en-US-JennyNeural, style: friendly, rate: "0%" }
    hiring-manager: { voice: en-US-GuyNeural,   style: null,     rate: "-5%" }
    panel:          { voice: en-GB-RyanNeural,  style: null,     rate: "0%" }
    me:             { voice: en-US-JennyNeural, style: null,     rate: "-10%" }   # voice for your own model answers
